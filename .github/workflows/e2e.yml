name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      E2E_REPOS_ROOT: /home/runner/work
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout E2E
        uses: actions/checkout@v4

      - name: Checkout API
        uses: actions/checkout@v4
        with:
          repository: oliverdiaz873/superior-hypermarket-api
          path: ../../superior-hypermarket-api

      - name: Checkout Angular Storefront
        uses: actions/checkout@v4
        with:
          repository: oliverdiaz873/superior-hypermarket-storefront-angular
          path: ../../superior-hypermarket-storefront-angular

      - name: Checkout Next Storefront
        uses: actions/checkout@v4
        with:
          repository: oliverdiaz873/superior-hypermarket-storefront-next
          path: ../../superior-hypermarket-storefront-next

      - name: Checkout Dashboard
        uses: actions/checkout@v4
        with:
          repository: oliverdiaz873/superior-hypermarket-dashboard
          path: ../../superior-hypermarket-dashboard

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install E2E dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci
        working-directory: ../../superior-hypermarket-api

      - name: Install Angular dependencies
        run: npm ci
        working-directory: ../../superior-hypermarket-storefront-angular

      - name: Install Next dependencies
        run: npm ci
        working-directory: ../../superior-hypermarket-storefront-next

      - name: Install Dashboard dependencies
        run: npm ci
        working-directory: ../../superior-hypermarket-dashboard

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
